<html>
    <head>
        <title>LATIHAN FORM DALAM HTML</title>
    </head>
    <body>
        <form name="formulir" action="" method="post">
        <table width="100%" border="1" bgcolor="orange">
            <tr>
                <td colspan="2" height="100px" align="center">
                    <img src="sekolahan-di-korea-selatan.jpg" alt="sekolah" height="400" width="100%">
                </td>
            </tr>
            <tr>
                <td valign="top" width="200px">
                    <div align="center">
                    <a href="index.html">Home</a>
                    <a href="registrasi.html">Registrasi</a>
                    </div>
                </td>
                <td>
                    <div align="center">
                        <font size="+2">
                            Pendaftaran Account Baru
                            <br>
                            <b>FACESCHOOL</b>
                            <i>The first Indonesian high school network.</i>
                        </font>
                    </div>
                    <table align="center" width="700px" border="1">
                        <tr>
                            <td align="center">
                                Nama Lengkap
                            </td>
                            <td>
                                <input type="text" name="nama">
                            </td>
                        </tr>
                        <tr>
                            <td align="center">
                                Gender
                            </td>
                            <td>
                                <input type="radio" name="gender"> Pria
                                <input type="radio" name="gender"> Wanita
                            </td>
                        </tr>
                        <tr>
                            <td align="center">
                                Hobi
                            </td>
                            <td>
                                <input type="checkbox" name="main_bola"> Sepak Bola
                                <br>
                                <input type="checkbox" name="bulutangkis"> Bulutangkis
                                <br>
                                <input type="checkbox" name="musik"> Musik
                            </td>
                        </tr>
                        <tr>
                            <td align="center">
                                Nomor HP
                            </td>
                            <td>
                                <input type="text" name="hp">
                            </td>
                        </tr>
                        <tr>
                            <td align="center">
                                Kota Sekarang
                            </td>
                            <td>
                                <select name="kota" size="1">
                                    <option>Jakarta</option>
                                    <option>Depok</option>
                                    <option>Bogor</option>
                                    <option>Bekasi</option>
                                    <option>Aceh</option>
                                    <option>Bandung</option>
                                    <option>Jayapura</option>
                                    <option>Solo</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td align="center">
                                Alamat
                            </td>
                            <td>
                                <textarea name="alamat" cols="20" rows="5"></textarea>
                            </td>
                        </tr>
                        <tr>
                            <td align="center">
                                Sekolah
                            </td>
                            <td>
                                <input type="text" name="sekolah">
                            </td>
                        </tr>
                        <tr>
                            <td align="center">
                                Username
                            </td>
                            <td>
                                <input type="text" name="username">
                            </td>
                        </tr>
                        <tr>
                            <td align="center">
                                Password
                            </td>
                            <td>
                                <input type="text" name="password">
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" align="center">
                                <input type="submit" value="Daftar">
                                <input type="reset" value="Reset">
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr>
                <td align="center" colspan="2">
                    <font size="2">
                        &copy; 2010 --- Indonesian High School Student Community
                    </font>
                </td>
            </tr>
        </table>
       </form>
    </body>
</html>
